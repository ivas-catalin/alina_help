<HTML>
<B>Applet for simulating the probability of a roll &lt; 4</B>
<BR>
<APPLET code="ProbSimApplet.class" width = 600 height = 450> 
<PARAM name="labs" value ="1,2,3,4,5,6">
<PARAM name="probs" value ="0.1666667,0.1666667,0.1666667,0.1666667,0.1666667,0.1666667">
<PARAM name="event" value ="0,1,2">
<PARAM name="button" value ="Roll">
<PARAM name="eventlab" value ="Roll < 4">
</APPLET>
